<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Signal Detector</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; padding: 2rem; }
        h1 { text-align: center; margin-bottom: 2rem; font-size: 2rem; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .upload-zone { border: 2px dashed #475569; border-radius: 1rem; padding: 3rem; text-align: center; cursor: pointer; transition: border-color 0.3s; }
        .upload-zone:hover { border-color: #38bdf8; }
        .upload-zone.active { border-color: #818cf8; background: rgba(129, 140, 248, 0.05); }
        input[type="file"] { display: none; }
        .btn { display: inline-block; padding: 0.75rem 2rem; background: linear-gradient(135deg, #3b82f6, #6366f1); border: none; border-radius: 0.5rem; color: white; font-size: 1rem; cursor: pointer; margin-top: 1rem; }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .results { margin-top: 2rem; background: #1e293b; border-radius: 1rem; padding: 1.5rem; display: none; }
        .results h2 { margin-bottom: 1rem; font-size: 1.25rem; }
        .detection { background: #334155; padding: 1rem; border-radius: 0.5rem; margin-bottom: 0.5rem; display: flex; justify-content: space-between; }
        .label { color: #38bdf8; font-weight: bold; }
        .confidence { color: #a3e635; }
        .error { color: #f87171; margin-top: 1rem; }
        .status { text-align: center; margin-top: 1rem; color: #94a3b8; }
        pre { background: #1e293b; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; font-size: 0.85rem; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Traffic Signal Detection</h1>
        <div class="upload-zone" id="dropZone">
            <p>Drag & drop an image here or click to select</p>
            <p style="color:#64748b; margin-top:0.5rem">Supports: JPG, JPEG, PNG, BMP</p>
            <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.bmp">
            <button class="btn" id="uploadBtn" disabled>Detect Signals</button>
        </div>
        <div class="status" id="status"></div>
        <div class="results" id="results">
            <h2>Detection Results</h2>
            <div id="detectionList"></div>
            <pre id="rawJson"></pre>
        </div>
    </div>
    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const status = document.getElementById('status');
        const results = document.getElementById('results');
        let selectedFile = null;

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('active'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('active'));
        dropZone.addEventListener('drop', e => {
            e.preventDefault(); dropZone.classList.remove('active');
            if (e.dataTransfer.files.length) { selectedFile = e.dataTransfer.files[0]; uploadBtn.disabled = false; status.textContent = selectedFile.name; }
        });
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) { selectedFile = fileInput.files[0]; uploadBtn.disabled = false; status.textContent = selectedFile.name; }
        });
        uploadBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            uploadBtn.disabled = true; status.textContent = 'Detecting...';
            const fd = new FormData(); fd.append('image', selectedFile);
            try {
                const res = await fetch('/api/detect', { method: 'POST', body: fd });
                const data = await res.json();
                if (data.error) { status.innerHTML = `<span class="error">${data.error}</span>`; results.style.display = 'none'; }
                else {
                    results.style.display = 'block';
                    document.getElementById('detectionList').innerHTML = data.detections.map(d =>
                        `<div class="detection"><span class="label">${d.label}</span><span class="confidence">${(d.confidence*100).toFixed(1)}%</span></div>`
                    ).join('') || '<p style="color:#94a3b8">No signals detected</p>';
                    document.getElementById('rawJson').textContent = JSON.stringify(data, null, 2);
                    status.textContent = `Found ${data.count} detection(s)`;
                }
            } catch(e) { status.innerHTML = `<span class="error">Request failed: ${e.message}</span>`; }
            uploadBtn.disabled = false;
        });
    </script>
</body>
</html>
